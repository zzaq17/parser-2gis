[tox]
envlist = flake8, mypy, py39, py310, py311
toxworkdir = {env:TOX_WORK_DIR:.tox}

[testenv]
deps =
  -e .[dev]
setenv = HOME = {envtmpdir}
commands =
  pytest -v

[testenv:flake8]
deps =
  flake8>=3.8.4,<4.1
commands =
  flake8 parser_2gis tests

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311

[testenv:mypy]
deps =
  mypy>=1.10,<2
  types-requests>=2.27

commands =
  mypy {posargs}
